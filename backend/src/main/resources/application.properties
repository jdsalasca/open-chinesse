server.port=8090
spring.application.name=open-chinesse

spring.datasource.url=jdbc:h2:file:${OPEN_CHINESE_DB:./data/open-chinesse};DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=true

# Base publica usada para construir los redirect_uri de OAuth2.
open-chinesse.base-url=${OPEN_CHINESE_BASE_URL:http://localhost:8090}

# Sesion de 30 dias en cookie SameSite=Lax.
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health
